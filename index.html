<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quadro Multiskill Sub - Chassi & Motor</title>

<!-- Biblioteca para PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
    margin: 0;
}

h2 {
    text-align: center;
}

.container {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
}

/* INPUTS MOBILE */
input, button, a {
    padding: 10px;
    font-size: 16px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
}

/* agrupar inputs no desktop */
@media (min-width: 768px) {
    input, button {
        width: auto;
    }
}

/* LINKS */
a {
    display: block;
    text-align: center;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

a:hover {
    background-color: #2980b9;
}

/* TABELA RESPONSIVA */
.table-wrapper {
    width: 100%;
    overflow-x: auto; /* <-- DESLIZA LATERAL */
    overflow-y: auto;
    max-height: 60vh;
    border: 1px solid #ccc;
}

/* tabela maior que tela */
table {
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 900px; /* força scroll horizontal */
}

/* células */
th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 12px;
}

/* cabeçalho fixo */
#skillTable thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: #eee;
}

#skillTable thead tr:nth-child(2) th {
    top: 30px;
    z-index: 2;
}

/* nomes */
.func-name {
    text-align: left;
    font-weight: bold;
    min-width: 120px;
}

/* bolinhas menores para celular */
.skill {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid #555;
}

/* cores */
.red { background: #e74c3c; }
.yellow { background: #f1c40f; }
.green { background: #2ecc71; }
.blue { background: #3498db; }

/* botão excluir */
.delete-btn {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px;
    cursor: pointer;
}

/* legenda */
.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 5px;
}

/* separador */
.group-separator {
    border-left: 3px solid #666 !important;
}

/* cabeçalho categorias */
#skillTable thead th[colspan] {
    background: #dfe6e9;
    font-weight: bold;
}
</style>
</head>

<body>

<h2>Quadro de Multiskill</h2>
<a href="multiskillLinha.html">Linha</a>

<div class="container" id="content">

    <input type="text" id="employeeName" placeholder="Nome do funcionário">
    <button onclick="addEmployee()">Adicionar</button>

    <input type="text" id="searchEmployee" placeholder="Pesquisar funcionário" onkeyup="renderTable()">

    <button onclick="exportJSON()">Exportar Backup</button>
    <input type="file" accept=".json" onchange="importJSON(event)">

    <button onclick="exportPDF()">Salvar em PDF</button>
    <div class="legend">
        <span><span class="skill red"></span> Não sabe</span>
        <span><span class="skill yellow"></span> Em treinamento</span>
        <span><span class="skill green"></span> Autônomo</span>
        <span><span class="skill blue"></span> Padrinho</span>
    </div>
<div class="table-wrapper">
    <table id="skillTable">
        <thead>
            <tr>
                <th rowspan="2">Funcionário</th>
                <th colspan="5">CHASSI</th>
                <th colspan="5">MOTOR</th>
		<th colspan="5">ARM</th>
                <th rowspan="2">Ação</th>
            </tr>
          <tr>
    <th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>

    <th class="group-separator">M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th>

    <th class="group-separator">ARM1</th><th>ARM2</th><th>ARM3</th><th>ARM4</th><th>ARM5</th>
</tr>
        </thead>
<tbody id="tableBody"></tbody>
    </table>

</div>
</div>

<script src="./script/script.js"></script>

</body>
</html>
