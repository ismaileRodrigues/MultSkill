<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadro Multiskill</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
    margin: 0;
}

h2 {
    text-align: center;
}

.container {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
}

/* inputs */
input, button, a {
    padding: 10px;
    font-size: 16px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
}

@media (min-width: 768px) {
    input, button {
        width: auto;
    }
}

a {
    display: block;
    text-align: center;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* tabela */
.table-wrapper {
    width: 100%;
    overflow: auto;
    max-height: 60vh;
    border: 1px solid #ccc;
}

table {
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 1200px; /* aumentado */
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 12px;
}

/* sticky header */
#skillTable thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: #eee;
}

#skillTable thead tr:nth-child(2) th {
    top: 30px;
}

/* nome */
.func-name {
    text-align: left;
    font-weight: bold;
}

/* bolinhas */
.skill {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid #555;
}

.red { background: #e74c3c; }
.yellow { background: #f1c40f; }
.green { background: #2ecc71; }
.blue { background: #3498db; }

.delete-btn {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px;
    cursor: pointer;
}
    .floating-btn {
    position: fixed;
    bottom: 20px;
    right: 15px;
    background: #3498db;
    color: white;
    padding: 14px;
    border-radius: 50px;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    z-index: 999;
}

.floating-btn:hover {
    background: #2980b9;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
}

.group-separator {
    border-left: 3px solid #666 !important;
}
</style>
</head>

<body>

<h2>Multiskill Sub Monatgens</h2>
<a href="multiskillLinha.html" class="floating-btn">
    📋 Linha
</a>
<div class="container" id="content">

<input type="text" id="employeeName" placeholder="Nome do funcionário">
<button onclick="addEmployee()">Adicionar</button>

<input type="text" id="searchEmployee" placeholder="Pesquisar funcionário" onkeyup="renderTable()">

<button onclick="exportJSON()">Exportar Backup</button>
<input type="file" accept=".json" onchange="importJSON(event)">

<button onclick="exportPDF()">Salvar em PDF</button>

<div class="legend">
    <span><span class="skill red"></span> Não sabe</span>
    <span><span class="skill yellow"></span> Em treinamento</span>
    <span><span class="skill green"></span> Autônomo</span>
    <span><span class="skill blue"></span> Padrinho</span>
</div>

<div class="table-wrapper">
<table id="skillTable">
<thead>

<tr>
    <th rowspan="2">Funcionário</th>

    <th colspan="5">CHASSI</th>
    <th colspan="5">MOTOR</th>
    <th colspan="5">ARM</th>
    <th colspan="2">VALVULA</th>
    <th colspan="2">RADIADOR</th>

    <th rowspan="2">Ação</th>
</tr>

<tr>
    <!-- CHASSI -->
    <th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>

    <!-- MOTOR -->
    <th class="group-separator">M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th>

    <!-- ARM -->
    <th class="group-separator">ARM1</th><th>ARM2</th><th>ARM3</th><th>ARM4</th><th>ARM5</th>

    <!-- VALVULA -->
    <th class="group-separator">V1</th><th>V2</th>

    <!-- RADIADOR -->
    <th class="group-separator">R1</th><th>R2</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>
</div>
</div>

<!-- SCRIPT SIMPLES FUNCIONAL -->
<script>
let employees = [];
const totalSkills = 19; // atualizado

function addEmployee() {
    const name = document.getElementById("employeeName").value;
    if (!name) return;

    employees.push({
        name: name,
        skills: Array(totalSkills).fill(0)
    });

    document.getElementById("employeeName").value = '';
    renderTable();
}

function changeSkill(empIndex, skillIndex) {
    employees[empIndex].skills[skillIndex]++;
    if (employees[empIndex].skills[skillIndex] > 3) {
        employees[empIndex].skills[skillIndex] = 0;
    }
    renderTable();
}

function getColor(value) {
    return ['red', 'yellow', 'green', 'blue'][value];
}

function renderTable() {
    const search = document.getElementById("searchEmployee").value.toLowerCase();
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = '';

    employees.forEach((emp, i) => {
        if (!emp.name.toLowerCase().includes(search)) return;

        let row = `<tr>
            <td class="func-name">${emp.name}</td>`;

        emp.skills.forEach((skill, j) => {
            row += `
            <td>
                <span class="skill ${getColor(skill)}"
                onclick="changeSkill(${i}, ${j})"></span>
            </td>`;
        });

        row += `<td><button class="delete-btn" onclick="deleteEmployee(${i})">X</button></td></tr>`;

        tbody.innerHTML += row;
    });
}

function deleteEmployee(index) {
    employees.splice(index, 1);
    renderTable();
}

function exportJSON() {
    const dataStr = JSON.stringify(employees);
    const blob = new Blob([dataStr], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup.json";
    a.click();
}

function importJSON(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        employees = JSON.parse(e.target.result);
        renderTable();
    };
    reader.readAsText(file);
}

function exportPDF() {
    const element = document.getElementById("content");
    html2pdf().from(element).save("multiskill.pdf");
}
</script>

</body>
</html>
