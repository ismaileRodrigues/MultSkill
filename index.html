<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quadro Multiskill</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
    margin: 0;
}

h2 { text-align: center; }

.container {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
}

input, button, a {
    padding: 10px;
    font-size: 16px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
}

@media (min-width: 768px) {
    input, button { width: auto; }
}

a {
    display: block;
    text-align: center;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    max-height: 60vh;
    border: 1px solid #ccc;
}

table {
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 1200px;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 12px;
}

thead th {
    position: sticky;
    top: 0;
    background: #eee;
    z-index: 2;
}

.func-name {
    text-align: left;
    font-weight: bold;
}

.skill {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid #555;
}

.red { background: #e74c3c; }
.yellow { background: #f1c40f; }
.green { background: #2ecc71; }
.blue { background: #3498db; }

.delete-btn {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.group-separator {
    border-left: 3px solid #666 !important;
}

    a {
    display: block;
    text-align: center;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

</style>
</head>

<body>

<h2>Multiskill Sub</h2>
<a href="multiskillLinha.html">Linha</a>
<div class="container" id="content">

<input type="text" id="employeeName" placeholder="Nome do funcionário">
<button onclick="addEmployee()">Adicionar</button>

<input type="text" id="searchEmployee" placeholder="Pesquisar" onkeyup="renderTable()">

<button onclick="exportJSON()">Exportar Backup</button>
<input type="file" accept=".json" onchange="importJSON(event)">

<button onclick="exportPDF()">Salvar em PDF</button>

<div class="table-wrapper">
<table id="skillTable">
<thead>
<tr>
<th rowspan="2">Funcionário</th>
<th colspan="5">CHASSI</th>
<th colspan="5">MOTOR</th>
<th colspan="5">ARM</th>
<th colspan="2">VÁLVULA</th>
<th colspan="2">RADIADOR</th>
<th rowspan="2">Ação</th>
</tr>
<tr>
<th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>
<th class="group-separator">M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th>
<th class="group-separator">ARM1</th><th>ARM2</th><th>ARM3</th><th>ARM4</th><th>ARM5</th>
<th class="group-separator">V1</th><th>V2</th>
<th class="group-separator">R1</th><th>R2</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<script>
const SKILL_COUNT = 19; // 5+5+5+2+2
let employees = JSON.parse(localStorage.getItem("multiskill")) || [];

function addEmployee() {
    const name = employeeName.value.trim();
    if (!name) return;

    employees.push({
        name,
        skills: Array(SKILL_COUNT).fill(0)
    });

    employeeName.value = "";
    save();
    renderTable();
}

function renderTable() {
    const search = searchEmployee.value.toLowerCase();
    tableBody.innerHTML = "";

    employees
        .filter(e => e.name.toLowerCase().includes(search))
        .forEach((emp, i) => {
            const tr = document.createElement("tr");

            const tdName = document.createElement("td");
            tdName.textContent = emp.name;
            tdName.className = "func-name";
            tr.appendChild(tdName);

            emp.skills.forEach((skill, idx) => {
                const td = document.createElement("td");
                if ([5,10,15,17].includes(idx)) td.classList.add("group-separator");

                const dot = document.createElement("span");
                dot.className = "skill " + getColor(skill);
                dot.onclick = () => {
                    emp.skills[idx] = (skill + 1) % 4;
                    save();
                    renderTable();
                };

                td.appendChild(dot);
                tr.appendChild(td);
            });

            const tdDel = document.createElement("td");
            const btn = document.createElement("button");
            btn.textContent = "X";
            btn.className = "delete-btn";
            btn.onclick = () => {
                employees.splice(i, 1);
                save();
                renderTable();
            };
            tdDel.appendChild(btn);
            tr.appendChild(tdDel);

            tableBody.appendChild(tr);
        });
}

function getColor(level) {
    return ["red", "yellow", "green", "blue"][level];
}

function save() {
    localStorage.setItem("multiskill", JSON.stringify(employees));
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(employees)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "multiskill.json";
    a.click();
}

function importJSON(e) {
    const reader = new FileReader();
    reader.onload = () => {
        employees = JSON.parse(reader.result);
        save();
        renderTable();
    };
    reader.readAsText(e.target.files[0]);
}

function exportPDF() {
    html2pdf().from(document.getElementById("content")).save("multiskill.pdf");
}

renderTable();
</script>

</body>
</html>
