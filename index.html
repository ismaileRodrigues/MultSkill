<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quadro Multiskill</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    margin: 0;
}

/* TOPO FIXO */
.topo-fixo {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #f4f6f8;
    padding: 10px;
}

h2 { text-align: center; }

a {
    display: block;
    text-align: center;
    background: #3498db;
    color: #fff;
    padding: 10px;
    text-decoration: none;
    border-radius: 5px;
    margin-bottom: 10px;
}

.container {
    background: white;
    padding: 10px;
    border-radius: 8px;
}

/* TABELA */
.table-wrapper {
    max-height: calc(100vh - 220px);
    overflow: auto;
}

table {
    border-collapse: collapse;
    min-width: 1200px;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
}

thead th {
    background: #eee;
}

/* HEADER CONGELADO */
#skillTable thead tr:first-child th {
    position: sticky;
    top: 0;
    z-index: 5;
}

#skillTable thead tr:nth-child(2) th {
    position: sticky;
    top: 30px;
    z-index: 4;
}

/* SKILLS */
.skill {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid #555;
}

.red { background: #e74c3c; }
.yellow { background: #f1c40f; }
.green { background: #2ecc71; }
.blue { background: #3498db; }

.group-separator {
    border-left: 3px solid #666 !important;
}

.delete-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ✅ TOPO CONGELADO -->
<div class="topo-fixo">

    <h2>Multiskill Sub</h2>

    <a href="multiskillLinha.html">Linha</a>

    <div class="container">
        <input type="text" id="employeeName" placeholder="Nome">
        <button onclick="addEmployee()">Adicionar</button>

        <input type="text" id="searchEmployee" placeholder="Pesquisar" onkeyup="renderTable()">

        <button onclick="exportJSON()">Exportar</button>
        <input type="file" onchange="importJSON(event)">

        <button onclick="exportPDF()">PDF</button>
    </div>

</div>

<!-- ✅ TABELA -->
<div class="table-wrapper">
<table id="skillTable">

<thead>
<tr>
<th rowspan="2">Funcionário</th>
<th colspan="5">CHASSI</th>
<th colspan="5">MOTOR</th>
<th colspan="5">ARM</th>
<th colspan="2">VÁLVULA</th>
<th colspan="2">RADIADOR</th>
<th rowspan="2">Ação</th>
</tr>

<tr>
<th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>

<th class="group-separator">M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th>

<th class="group-separator">ARM1</th><th>ARM2</th><th>ARM3</th><th>ARM4</th><th>ARM5</th>

<th class="group-separator">V1</th><th>V2</th>

<th class="group-separator">R1</th><th>R2</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>
</div>

<script>
const SKILL_COUNT = 19;

let employees = JSON.parse(localStorage.getItem("multiskill")) || [];

// ✅ Corrige dados antigos
employees = employees.map(emp => {
    if (!emp.skills) emp.skills = [];
    while (emp.skills.length < SKILL_COUNT) {
        emp.skills.push(0);
    }
    return emp;
});

function addEmployee() {
    const name = employeeName.value.trim();
    if (!name) return;

    employees.push({
        name,
        skills: Array(SKILL_COUNT).fill(0)
    });

    employeeName.value = "";
    save();
    renderTable();
}

function renderTable() {
    const search = searchEmployee.value.toLowerCase();
    tableBody.innerHTML = "";

    employees
    .filter(e => e.name.toLowerCase().includes(search))
    .forEach((emp, i) => {

        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = emp.name;
        tr.appendChild(tdName);

        emp.skills.forEach((skill, idx) => {

            const td = document.createElement("td");

            if ([5,10,15,17].includes(idx)) {
                td.classList.add("group-separator");
            }

            const dot = document.createElement("span");
            dot.className = "skill " + getColor(skill);

            dot.onclick = () => {
                emp.skills[idx] = (emp.skills[idx] + 1) % 4;
                save();
                renderTable();
            };

            td.appendChild(dot);
            tr.appendChild(td);
        });

        const tdDel = document.createElement("td");
        const btn = document.createElement("button");

        btn.textContent = "X";
        btn.className = "delete-btn";

        btn.onclick = () => {
            employees.splice(i, 1);
            save();
            renderTable();
        };

        tdDel.appendChild(btn);
        tr.appendChild(tdDel);

        tableBody.appendChild(tr);
    });
}

function getColor(level) {
    return ["red","yellow","green","blue"][level] || "red";
}

function save() {
    localStorage.setItem("multiskill", JSON.stringify(employees));
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(employees)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup.json";
    a.click();
}

function importJSON(e) {
    const reader = new FileReader();

    reader.onload = () => {
        employees = JSON.parse(reader.result);

        employees = employees.map(emp => {
            if (!emp.skills) emp.skills = [];
            while (emp.skills.length < SKILL_COUNT) {
                emp.skills.push(0);
            }
            return emp;
        });

        save();
        renderTable();
    };

    reader.readAsText(e.target.files[0]);
}

function exportPDF() {
    html2pdf().from(document.body).save("multiskill.pdf");
}

renderTable();
</script>

</body>
</html>
