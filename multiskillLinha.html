<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Steps - Seção</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
    margin: 0;
}

.container {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
}

/* INPUTS MOBILE */
input, button, a {
    padding: 10px;
    font-size: 16px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
}

/* desktop volta ao normal */
@media (min-width: 768px) {
    input, button {
        width: auto;
    }
}

/* ===== ÁREA DA TABELA ===== */
.table-wrapper {
    width: 100%;
    max-height: 65vh;
    overflow: auto; /* ativa scroll horizontal e vertical */
    border: 1px solid #ccc;
    position: relative;
}

/* ===== TABELA ===== */
#skillTable {
    border-collapse: separate;
    border-spacing: 0;
    min-width: 900px; /* força scroll lateral no celular */
}

/* células menores no mobile */
th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 12px;
}

/* ===== CABEÇALHO FIXO ===== */
#skillTable thead th {
    position: sticky;
    top: 0;
    background: #eee;
    z-index: 5;
    box-shadow: 0 2px 2px rgba(0,0,0,0.1);
}

/* ===== PRIMEIRA COLUNA FIXA ===== */
#skillTable td:first-child,
#skillTable th:first-child {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 4;
    min-width: 120px;
}

/* cabeçalho primeira coluna */
#skillTable th:first-child {
    z-index: 6;
    background: #eee;
}

/* nome funcionário */
.func-name {
    text-align: left;
    font-weight: bold;
}

/* ===== BOLINHAS (TOQUE MELHOR) ===== */
.skill {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    border: 1px solid #555;
}

/* cores */
.red { background: #e74c3c; }
.yellow { background: #f1c40f; }
.green { background: #2ecc71; }
.blue { background: #3498db; }

/* botão excluir maior p/ dedo */
.delete-btn {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px;
    cursor: pointer;
}

/* legenda organizada */
.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
}

/* botão link */
a {
    display: block;
    text-align: center;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

a:hover {
    background-color: #2980b9;
}
</style>
</head>

<body>

<h2>Controle de Steps – Linha Principal</h2>
<a href="index.html">Sub</a>

<div class="container" id="content">

    <input type="text" id="employeeName" placeholder="Nome do funcionário">
    <button onclick="addEmployee()">Adicionar</button>

    <input type="text" id="searchEmployee" placeholder="Pesquisar funcionário" onkeyup="renderTable()">

    <button onclick="exportJSON()">Exportar Backup</button>
    <input type="file" accept=".json" onchange="importJSON(event)">

    <button onclick="exportPDF()">Salvar em PDF</button>

    <div class="legend">
        <span><span class="skill red"></span> Não sabe</span>
        <span><span class="skill yellow"></span> Em treinamento</span>
        <span><span class="skill green"></span> Autônomo</span>
        <span><span class="skill blue"></span> Padrinho</span>
    </div>

<div class="table-wrapper">
    <table id="skillTable">
        <thead>
            <tr>
                <th>Funcionário</th>
                <th>Step 1</th>
                <th>Step 2</th>
                <th>Step 3</th>
                <th>Step 4</th>
                <th>Step 5</th>
                <th>Step 6</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

</div>

<script>
const colors = ["red", "yellow", "green", "blue"];
const STORAGE_KEY = "steps_secao";

let employees = [];

try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    employees = Array.isArray(data) ? data : [];
} catch {
    employees = [];
}

function normalizeEmployee(emp) {
    return {
        name: emp?.name || "",
        steps: Array.isArray(emp?.steps)
            ? [...emp.steps, 0, 0, 0, 0, 0].slice(0, 6)
            : Array(6).fill(0)
    };
}

function saveStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(employees));
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    const search = document.getElementById("searchEmployee").value.toLowerCase();

    employees = employees.map(normalizeEmployee);

    employees
        .filter(e => e.name.toLowerCase().includes(search))
        .forEach((emp, empIndex) => {

            const tr = document.createElement("tr");

            const tdName = document.createElement("td");
            tdName.textContent = emp.name;
            tdName.className = "func-name";
            tr.appendChild(tdName);

            emp.steps.forEach((_, stepIndex) => {
                const td = document.createElement("td");
                const div = document.createElement("div");

                const level = emp.steps[stepIndex] ?? 0;
                div.className = "skill " + (colors[level] || "red");

                div.onclick = () => {
                    emp.steps[stepIndex] = (emp.steps[stepIndex] + 1) % colors.length;
                    saveStorage();
                    renderTable();
                };

                td.appendChild(div);
                tr.appendChild(td);
            });

            const tdDel = document.createElement("td");
            const btn = document.createElement("button");
            btn.textContent = "X";
            btn.className = "delete-btn";

            btn.onclick = () => {
                employees.splice(empIndex, 1);
                saveStorage();
                renderTable();
            };

            tdDel.appendChild(btn);
            tr.appendChild(tdDel);

            tbody.appendChild(tr);
        });
}

function addEmployee() {
    const input = document.getElementById("employeeName");
    const name = input.value.trim();
    if (!name) return;

    employees.push({
        name,
        steps: Array(6).fill(0)
    });

    input.value = "";
    saveStorage();
    renderTable();
}

function exportJSON() {
    const blob = new Blob(
        [JSON.stringify(employees, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "steps_secao_backup.json";
    a.click();
    URL.revokeObjectURL(url);
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw "inválido";

            employees = data.map(normalizeEmployee);
            saveStorage();
            renderTable();

            alert("Backup carregado com sucesso!");
        } catch {
            alert("Arquivo JSON inválido");
        }
    };
    reader.readAsText(file);
}

function exportPDF() {
    if (typeof html2pdf === "undefined") {
        alert("Biblioteca PDF não carregada.");
        return;
    }

    html2pdf()
        .set({
            margin: 5,
            filename: "controle_steps.pdf",
            html2canvas: { scale: 1.5 },
            jsPDF: { orientation: "landscape", unit: "mm", format: "a4" }
        })
        .from(document.getElementById("content"))
        .save();
}

saveStorage();
renderTable();
</script>

</body>
</html>
